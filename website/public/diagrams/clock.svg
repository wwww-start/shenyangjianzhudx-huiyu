<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">时钟树 · 简化路径</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6288b2"/></marker></defs><rect width="900" height="360" rx="20" fill="#f5f8fc"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="450" y="40" text-anchor="middle" font-size="23" fill="#233b58">时钟树 · 简化路径</text><rect x="30" y="80" width="155" height="65" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="107.5" y="118.5" text-anchor="middle" font-size="18" fill="#233b58">HSI / HSE</text><path d="M190 112 L255 112" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="260" y="80" width="165" height="65" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="342.5" y="118.5" text-anchor="middle" font-size="18" fill="#233b58">选择 / PLL</text><path d="M430 112 L510 112" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="515" y="80" width="165" height="65" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="597.5" y="118.5" text-anchor="middle" font-size="18" fill="#233b58">SYSCLK</text><path d="M600 150 L600 195" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="490" y="200" width="215" height="70" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="597.5" y="241.0" text-anchor="middle" font-size="18" fill="#233b58">AHB → HCLK</text><path d="M485 235 L390 235" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="155" y="200" width="230" height="70" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="270.0" y="241.0" text-anchor="middle" font-size="18" fill="#233b58">APB1 / APB2 分频</text><text x="450" y="325" text-anchor="middle" font-size="16" fill="#233b58">APB 分频不为 1 时，相关定时器时钟通常为 2 × PCLK。</text></g></svg>