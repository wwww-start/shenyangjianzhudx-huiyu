<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">从环境到动作，再回到测量</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6288b2"/></marker></defs><rect width="900" height="360" rx="20" fill="#f5f8fc"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="450" y="40" text-anchor="middle" font-size="23" fill="#233b58">从环境到动作，再回到测量</text><rect x="30" y="115" width="180" height="100" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="120.0" y="165.0" text-anchor="middle" font-size="18" fill="#233b58">感知</text><text x="120.0" y="192.0" text-anchor="middle" font-size="13" fill="#233b58">传感器 / 相机</text><path d="M215 165 L245 165" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="250" y="115" width="180" height="100" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="340.0" y="165.0" text-anchor="middle" font-size="18" fill="#233b58">计算</text><text x="340.0" y="192.0" text-anchor="middle" font-size="13" fill="#233b58">MCU / 上位机</text><path d="M435 165 L465 165" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="470" y="115" width="180" height="100" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="560.0" y="165.0" text-anchor="middle" font-size="18" fill="#233b58">执行</text><text x="560.0" y="192.0" text-anchor="middle" font-size="13" fill="#233b58">驱动器 / 电机</text><path d="M655 165 L685 165" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="690" y="115" width="180" height="100" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="780.0" y="165.0" text-anchor="middle" font-size="18" fill="#233b58">环境</text><text x="780.0" y="192.0" text-anchor="middle" font-size="13" fill="#233b58">运动产生变化</text><text x="450" y="290" text-anchor="middle" font-size="16" fill="#233b58">控制不是单向发命令：测量结果需要返回计算环节。</text></g></svg>