<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">GPIO 输出级 · 概念示意</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6288b2"/></marker></defs><rect width="900" height="360" rx="20" fill="#f5f8fc"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="450" y="40" text-anchor="middle" font-size="23" fill="#233b58">GPIO 输出级 · 概念示意</text><rect x="90" y="80" width="280" height="215" rx="14" fill="#e7eef9" stroke="#bdcde0"/><text x="230.0" y="193.5" text-anchor="middle" font-size="18" fill="#233b58"></text><rect x="530" y="80" width="280" height="215" rx="14" fill="#e1f3ed" stroke="#bdcde0"/><text x="670.0" y="193.5" text-anchor="middle" font-size="18" fill="#233b58"></text><text x="230" y="110" text-anchor="middle" font-size="18" fill="#233b58">推挽输出</text><text x="670" y="110" text-anchor="middle" font-size="18" fill="#233b58">开漏输出</text><text x="230" y="140" text-anchor="middle" font-size="14" fill="#233b58">VDD</text><path d="M230 148 L230 180" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="230" y="245" text-anchor="middle" font-size="14" fill="#233b58">GND</text><text x="670" y="140" text-anchor="middle" font-size="14" fill="#233b58">VDD</text><path d="M670 148 L670 180" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="670" y="245" text-anchor="middle" font-size="14" fill="#233b58">GND</text><text x="230" y="180" text-anchor="middle" font-size="15" fill="#233b58">上管 / 下管</text><path d="M230 185 L340 185" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="320" y="213" text-anchor="middle" font-size="14" fill="#233b58">引脚</text><text x="670" y="170" text-anchor="middle" font-size="15" fill="#233b58">上拉电阻</text><path d="M670 185 L780 185" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="770" y="213" text-anchor="middle" font-size="14" fill="#233b58">引脚</text><text x="670" y="225" text-anchor="middle" font-size="13" fill="#233b58">下管：导通 / 释放</text><text x="450" y="333" text-anchor="middle" font-size="16" fill="#233b58">推挽主动拉高或拉低；开漏释放后依赖上拉建立高电平。</text></g></svg>