<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">MCU 内部：谁负责什么</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6288b2"/></marker></defs><rect width="900" height="360" rx="20" fill="#f5f8fc"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="450" y="40" text-anchor="middle" font-size="23" fill="#233b58">MCU 内部：谁负责什么</text><rect x="40" y="90" width="210" height="180" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="145.0" y="180.0" text-anchor="middle" font-size="18" fill="#233b58">CPU / Cortex-M3</text><text x="145.0" y="207.0" text-anchor="middle" font-size="13" fill="#233b58">取指 · 运算 · 控制</text><path d="M255 175 L330 175" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="340" y="90" width="210" height="70" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="445.0" y="125.0" text-anchor="middle" font-size="18" fill="#233b58">Flash</text><text x="445.0" y="152.0" text-anchor="middle" font-size="13" fill="#233b58">程序与常量</text><rect x="340" y="195" width="210" height="70" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="445.0" y="230.0" text-anchor="middle" font-size="18" fill="#233b58">SRAM</text><text x="445.0" y="257.0" text-anchor="middle" font-size="13" fill="#233b58">变量与栈</text><path d="M555 175 L620 175" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="630" y="90" width="220" height="175" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="740.0" y="177.5" text-anchor="middle" font-size="18" fill="#233b58">外设与寄存器</text><text x="740.0" y="204.5" text-anchor="middle" font-size="13" fill="#233b58">GPIO / TIM / ADC / UART</text><text x="450" y="325" text-anchor="middle" font-size="15" fill="#233b58">内部总线连接运算、存储与外设；寄存器把软件意图变成硬件配置。</text></g></svg>