<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">解码器式 Transformer · 概念流程</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6288b2"/></marker></defs><rect width="900" height="360" rx="20" fill="#f5f8fc"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="450" y="40" text-anchor="middle" font-size="23" fill="#233b58">解码器式 Transformer · 概念流程</text><rect x="30" y="115" width="180" height="100" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="120.0" y="165.0" text-anchor="middle" font-size="18" fill="#233b58">Token 与嵌入</text><text x="120.0" y="192.0" text-anchor="middle" font-size="13" fill="#233b58">加上位置相关信息</text><path d="M215 165 L245 165" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="250" y="115" width="180" height="100" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="340.0" y="165.0" text-anchor="middle" font-size="18" fill="#233b58">因果注意力</text><text x="340.0" y="192.0" text-anchor="middle" font-size="13" fill="#233b58">Q / K / V · 遮罩</text><path d="M435 165 L465 165" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="470" y="115" width="180" height="100" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="560.0" y="165.0" text-anchor="middle" font-size="18" fill="#233b58">前馈变换</text><text x="560.0" y="192.0" text-anchor="middle" font-size="13" fill="#233b58">残差 / 归一化</text><path d="M655 165 L685 165" stroke="#6288b2" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="690" y="115" width="180" height="100" rx="14" fill="#e4eefb" stroke="#bdcde0"/><text x="780.0" y="165.0" text-anchor="middle" font-size="18" fill="#233b58">输出分布</text><text x="780.0" y="192.0" text-anchor="middle" font-size="13" fill="#233b58">选择下一 Token</text><text x="450" y="290" text-anchor="middle" font-size="16" fill="#233b58">中间模块重复堆叠；新 Token 加入上下文，再次计算。</text></g></svg>